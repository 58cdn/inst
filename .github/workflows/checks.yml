name: Installer checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Syntax and isolated regression tests
        run: |
          sh -n install.sh
          if command -v dash >/dev/null; then dash -n install.sh; fi
          if command -v zsh >/dev/null; then zsh -n install.zsh; fi
          bash -n scripts/install-unix.sh
          bash tests/unix-regression.sh
      - name: Site build and Worker routing
        run: |
          node tools/build-site.mjs
          node tests/worker.test.mjs
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Windows PowerShell checks
        shell: powershell
        run: |
          ./tests/check-readonly.ps1
          ./tests/node-version.ps1
          ./tests/python-version.ps1
          ./tests/windows-regression.ps1
      - name: PowerShell 7 parse check
        shell: pwsh
        run: ./tests/check-readonly.ps1
  # https://inst.linux.yun (Cloudflare Workers, see wrangler.jsonc). Runs only after every
  # check passed on the default branch. Needs the repository secrets CLOUDFLARE_API_TOKEN
  # ("Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID; without them it only
  # does a dry run.
  deploy:
    needs: [unix, windows]
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: wrangler deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set; running wrangler deploy --dry-run only'
            npx --yes wrangler@4.143.0 deploy --dry-run
          else
            npx --yes wrangler@4.143.0 deploy
          fi
